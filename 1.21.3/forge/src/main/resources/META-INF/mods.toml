modLoader = "javafml"
loaderVersion = "[53, 54)"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    authors = "${mod_author}"
    description = '''${mod_description}'''
    logoFile = "icon.png"

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "[53, 54)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "resourceconfigapi"
    mandatory = true
    versionRange = "[${minecraft_version}-${resource_config_api}, )"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "resourcelibrary"
    mandatory = true
    versionRange = "[${minecraft_version}-${resource_library}, )"
    ordering = "AFTER"
    side = "BOTH"