modLoader = "javafml" #mandatory
loaderVersion = "[4,)" #mandatory
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    iconFile="${mod_id}.png"
    bannerFile="${mod_id}_banner.png"
    authors = "${mod_author}"
    description = '''${mod_description}'''

[[mixins]]
    config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type="required"
    versionRange = "[${neoforge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type="required"
    versionRange = "[${minecraft_version},)"
    ordering = "NONE"
    side = "BOTH"
